# Publication npm de @rovia/ui par Changesets (spec 0001, AC-7).
# Sur main : s'il reste des changesets, ouvre ou met à jour la pull request
# « Version des paquets » ; quand elle est fusionnée, publie la version sur npm.
# Secret requis : NPM_TOKEN (jeton d'automatisation de l'organisation rovia).
name: Publication

on:
  push:
    branches: [main]

concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publier:
    name: Version ou publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Version des paquets"
          commit: "Version des paquets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
