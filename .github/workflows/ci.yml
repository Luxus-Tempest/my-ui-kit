# Intégration continue :
# 1. vérifier : types, tests (Vitest + axe), build (librairie, Storybook,
#    application d'exemple Next.js), budget de poids, test de fumée de
#    l'application d'exemple ;
# 2. navigateur : chaque story dans Chromium, accessibilité (axe, contraste
#    compris) en clair et en sombre, et régression visuelle en clair, en sombre
#    et en RTL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Types, tests, build et poids
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue dans "packageManager" du package.json racine.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: pnpm lint

      - name: Tests (Vitest, Testing Library, axe)
        run: pnpm test

      - name: Build (librairie, Storybook, application d'exemple)
        run: pnpm build

      - name: Budget de poids
        run: pnpm size

      # L'application d'exemple, buildée juste au-dessus : pages hydratées sans
      # erreur, navigation, recherche, server action, thème.
      - name: Installer Chromium
        run: pnpm --filter example exec playwright install --with-deps chromium

      - name: Application d'exemple (Playwright)
        run: pnpm --filter example e2e

      - name: Conserver le Storybook construit
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          retention-days: 7

  navigateur:
    name: Accessibilité et régression visuelle
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Récupérer le Storybook construit
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: apps/docs/storybook-static

      - name: Installer Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      # Les références visuelles sont celles du dernier passage sur main.
      - name: Restaurer les références visuelles
        uses: actions/cache/restore@v4
        with:
          path: apps/docs/tests/__screenshots__
          key: visual-${{ runner.os }}-${{ github.sha }}
          restore-keys: visual-${{ runner.os }}-

      # Sur main, les captures deviennent les nouvelles références. Sur une pull
      # request, elles sont comparées : un écart fait échouer le job, le rapport
      # (images attendue, obtenue, différence) est joint ci-dessous.
      - name: Tester chaque story
        run: pnpm --filter docs exec playwright test ${{ github.ref == 'refs/heads/main' && '--update-snapshots=all' || '' }}

      - name: Enregistrer les références (main)
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v4
        with:
          path: apps/docs/tests/__screenshots__
          key: visual-${{ runner.os }}-${{ github.sha }}

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

  # Installation réelle du registre (spec 0001) : archive du paquet, registre
  # local, application Next.js vierge sans Tailwind, bloc connexion et éjection
  # de button, types, build, navigateur et --overwrite. Captures jointes.
  registre:
    name: Registre, installation réelle
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le paquet
        run: pnpm --filter @rovia/ui build

      - name: Installer Chromium
        run: pnpm --filter @rovia/registry exec playwright install --with-deps chromium

      - name: Installer un bloc et éjecter un composant
        run: pnpm --filter @rovia/registry smoke

      - name: Captures de l'application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registre-captures
          path: packages/registry/smoke-results
          retention-days: 7

  # Storybook et le registre (r/*.json), construits par le job « verifier »,
  # publiés ensemble sur GitHub Pages à chaque push sur main.
  deployer:
    name: Déployer la documentation et le registre
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verifier, navigateur, registre]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Récupérer le Storybook construit
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Vérifier la présence du registre
        run: test -f storybook-static/r/registry.json && test -f storybook-static/r/connexion.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - id: deploiement
        uses: actions/deploy-pages@v4
