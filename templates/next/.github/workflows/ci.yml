# Intégration continue de l'application : types, lint, Prettier, build, puis tests Playwright
# sur la version construite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Types, lint, build et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue dans « packageManager » du package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install

      - name: Types
        run: pnpm typecheck

      - name: Lint et format
        run: pnpm lint && pnpm exec prettier --check .

      - name: Build
        run: pnpm build

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests Playwright
        run: pnpm test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
